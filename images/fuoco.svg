<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .o{stroke:#111;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
      .txt{font:900 44px Arial, sans-serif;fill:#ff5a3c;stroke:#111;stroke-width:8;paint-order:stroke}
    </style>
  </defs>

  <!-- Boiler body -->
  <rect x="150" y="120" width="212" height="310" rx="32" fill="#ffd2c7" class="o"/>
  <rect x="176" y="150" width="160" height="180" rx="22" fill="#ffe7e2" class="o"/>

  <!-- Panic face -->
  <circle cx="218" cy="255" r="10" fill="#111"/>
  <circle cx="294" cy="255" r="10" fill="#111"/>
  <path d="M230 240c-18-16-36-10-48 6" fill="none" class="o"/>
  <path d="M282 240c18-16 36-10 48 6" fill="none" class="o"/>
  <path d="M240 304c10-18 38-18 48 0c-16 12-32 12-48 0z" fill="#111" class="o"/>

  <!-- Big flames -->
  <path d="M256 458c-60-40-70-96-28-140c-6 34 18 52 34 76c12 18 6 38-6 52z"
        fill="#ff2d1a" class="o"/>
  <path d="M256 438c-40-28-46-66-18-96c-4 24 12 36 22 52c8 12 4 26-4 34z"
        fill="#ffb000" class="o"/>
  <path d="M256 420c-22-16-26-38-10-56c-2 14 6 20 10 30c4 10 2 18-10 26z"
        fill="#fff000" class="o"/>

  <!-- Smoke -->
  <path d="M120 110c30-20 60-20 90 0c30-20 60-20 90 0c30-20 60-20 90 0"
        fill="none" stroke="#777" stroke-width="16" stroke-linecap="round" opacity="0.7"/>
  <path d="M140 80c22-16 44-16 66 0c22-16 44-16 66 0c22-16 44-16 66 0"
        fill="none" stroke="#777" stroke-width="12" stroke-linecap="round" opacity="0.55"/>

  <text x="256" y="95" text-anchor="middle" class="txt">AIUTO!</text>
</svg>
