<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .o{stroke:#111;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
      .txt{font:900 44px Arial, sans-serif;fill:#74d7ff;stroke:#111;stroke-width:8;paint-order:stroke}
    </style>
  </defs>

  <!-- Heat pump body -->
  <rect x="96" y="150" width="320" height="250" rx="28" fill="#d7dee6" class="o"/>
  <rect x="120" y="178" width="272" height="190" rx="20" fill="#eef3f8" class="o"/>

  <!-- Fan -->
  <circle cx="256" cy="268" r="84" fill="#c7d3df" class="o"/>
  <circle cx="256" cy="268" r="24" fill="#98a9ba" class="o"/>
  <path d="M256 188c26 16 38 46 18 70c-16 20-50 22-70 6" fill="none" class="o"/>
  <path d="M176 268c16-26 46-38 70-18c20 16 22 50 6 70" fill="none" class="o"/>
  <path d="M256 348c-26-16-38-46-18-70c16-20 50-22 70-6" fill="none" class="o"/>
  <path d="M336 268c-16 26-46 38-70 18c-20-16-22-50-6-70" fill="none" class="o"/>

  <!-- Silly face -->
  <circle cx="214" cy="350" r="10" fill="#111"/>
  <circle cx="298" cy="350" r="10" fill="#111"/>
  <path d="M230 378c16 12 36 12 52 0" fill="none" class="o"/>

  <!-- Cold wind -->
  <path d="M72 240c70-40 140-40 210 0c70-40 120-40 158 0" fill="none" stroke="#74d7ff" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <path d="M82 280c60-30 120-30 180 0c60-30 110-30 150 0" fill="none" stroke="#74d7ff" stroke-width="10" stroke-linecap="round" opacity="0.75"/>

  <!-- Snowflakes -->
  <g stroke="#74d7ff" stroke-width="8" stroke-linecap="round" opacity="0.95">
    <path d="M420 190v36M402 208h36M408 196l24 24M432 196l-24 24"/>
    <path d="M440 310v36M422 328h36M428 316l24 24M452 316l-24 24"/>
    <path d="M92 190v30M77 205h30M82 196l20 20M102 196l-20 20"/>
  </g>

  <text x="256" y="120" text-anchor="middle" class="txt">COOLING!</text>
</svg>
