<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Hunt</title>

  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --accent:#3ad6ff;
      --danger:#ff4b4b;
    }

    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: Arial, sans-serif;
      background:#fff;
      color:#111;
      overflow:hidden;
    }

    /* START SCREEN */
    #enterBtn{
      width:130px;
      height:130px;
      border-radius:50%;
      background:#000;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      font-size:20px;
      font-weight:900;
      letter-spacing:1px;
    }

    /* PASSWORD SCREEN */
    #loginBox{
      display:none;
      flex-direction:column;
      align-items:center;
      gap:10px;
    }
    #password{
      width:min(300px, 82vw);
      padding:12px 14px;
      font-size:16px;
      border-radius:12px;
      border:1px solid #ddd;
      outline:none;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }
    #okBtn{
      padding:10px 18px;
      border-radius:12px;
      border:none;
      cursor:pointer;
      font-size:16px;
      background:#111;
      color:#fff;
      font-weight:800;
    }
    #errorMsg{
      display:none;
      color:var(--danger);
      font-size:14px;
      font-weight:900;
    }

    /* APP SCREEN */
    #app{
      display:none;
      position:relative;
      width:100%;
      height:100%;
      background:var(--bg);
      color:var(--fg);
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:10px;
      padding:18px 18px 22px;
      box-sizing:border-box;
    }

    /* popup messaggi random */
    #toast{
      position:absolute;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      max-width:min(680px, 92vw);
      padding:10px 14px;
      border-radius:14px;
      background:rgba(255,255,255,0.10);
      border:1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-weight:800;
      text-align:center;
      opacity:0;
      pointer-events:none;
      transition: opacity .35s ease, transform .35s ease;
    }
    #toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    #statusImage{
      width:min(320px, 72vw);
      height:auto;
      filter: drop-shadow(0 12px 22px rgba(0,0,0,.6));
      transition: opacity .18s ease, transform .18s ease;
      opacity: 1;
    }

    #statusText{
      font-size:34px;
      font-weight:900;
      letter-spacing:1px;
      text-align:center;
      margin-top:2px;
    }

    #distanceText{
      font-size:16px;
      opacity:.92;
      text-align:center;
      white-space:pre-line;
    }

    /* Radar widget */
    #radarWrap{
      margin-top:10px;
      width:200px;
      height:200px;
      position:relative;
    }

    .radar{
      position:absolute;
      inset:0;
      border-radius:50%;
      overflow:hidden;
      background: radial-gradient(circle, rgba(58,214,255,0.14), #0b1120);
      border:1px solid rgba(255,255,255,0.22);
      box-shadow:0 0 22px rgba(58,214,255,0.25);
    }
    .radar__circle{
      position:absolute;
      inset:14%;
      border-radius:50%;
      border:1px solid rgba(58,214,255,0.35);
    }
    .radar__circle.inner{ inset:30%; }
    .radar__circle.inner2{ inset:46%; }

    .radar__cross{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        linear-gradient(transparent 49.6%, rgba(58,214,255,0.20) 50%, transparent 50.4%),
        linear-gradient(90deg, transparent 49.6%, rgba(58,214,255,0.20) 50%, transparent 50.4%);
      opacity:.75;
      pointer-events:none;
    }

    /* Sweep più lento (prima era 2.8s) */
    .radar__beam{
      position:absolute;
      inset:-10%;
      background: conic-gradient(from 90deg, rgba(58,214,255,0.30), transparent 60%);
      animation: radarSpin 7.0s linear infinite;
      pointer-events:none;
    }
    @keyframes radarSpin { to { transform: rotate(360deg); } }

    .radar__centerDot{
      position:absolute;
      left:50%; top:50%;
      width:8px; height:8px;
      transform:translate(-50%,-50%);
      background:rgba(58,214,255,0.95);
      border-radius:50%;
      box-shadow:0 0 12px rgba(58,214,255,0.9);
    }

    .radar__targetDot{
      position:absolute;
      left:50%; top:50%;
      width:10px; height:10px;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:rgba(255,255,255,0.95);
      box-shadow:0 0 14px rgba(255,255,255,0.65);
      transition: transform .18s ease;
    }

    /* Piccolo “punch” quando cambia stato */
    .pop{ transform: scale(1.03); }

    @media (prefers-reduced-motion: reduce){
      .radar__beam{ animation: none; }
      #statusImage{ transition: none; }
      .radar__targetDot{ transition:none; }
      #toast{ transition:none; }
    }
  </style>
</head>

<body>

  <div id="enterBtn">START</div>

  <div id="loginBox">
    <input id="password" type="text" placeholder="Inserisci password" autocomplete="off" />
    <button id="okBtn">OK</button>
    <div id="errorMsg">Password errata</div>
  </div>

  <div id="app">
    <div id="toast"></div>

    <img id="statusImage" src="images/ghiacciato.svg" alt="">
    <div id="statusText">…</div>
    <div id="distanceText">Distanza: …</div>

    <div id="radarWrap" aria-label="Radar">
      <div class="radar">
        <div class="radar__beam"></div>
        <div class="radar__cross"></div>
        <div class="radar__circle"></div>
        <div class="radar__circle inner"></div>
        <div class="radar__circle inner2"></div>
        <div class="radar__centerDot"></div>
        <div id="targetDot" class="radar__targetDot"></div>
      </div>
    </div>
  </div>

<script>
  /* ------------------ Config ------------------ */
  const TARGET_LAT = 45.851823282124876;
  const TARGET_LON = 9.40799408339509;

  const T_FUOCO = 10;
  const T_FUOCHINO = 25;
  const T_FREDDO = 100;

  const IMG = {
    GHIACCIATO: "images/ghiacciato.svg",
    FREDDO: "images/freddo.svg",
    FUOCHINO: "images/fuochino.svg",
    FUOCO: "images/fuoco.svg"
  };

  const MESSAGES = [
    "pensavi sarebbe stato più semplice, vero?",
    "quanti errori hai fatto nella vita per arrivare a questo punto",
    "ma pensa potevi stare a casa a dormire",
    "questo non c'era nel contratto",
    "maledetti nerd",
    "guarda, c'è un gattino alla tua destra! MIAOOOO",
    "Bip Bip Bip Bip Bip",
    "Citazione di Katy Perry"
  ];

  // Sweep: deve matchare la durata CSS (7.0s)
  const SWEEP_PERIOD_MS = 7000;
  // Dove “punta” il fascio in termini di gradi (0=su/Nord, cresce clockwise).
  // Con "conic-gradient(from 90deg)" il fascio base punta a destra, quindi aggiungiamo 90°.
  const SWEEP_OFFSET_DEG = 90;
  // Quanto vicino deve essere il fascio al pallino per fare "beep"
  const SWEEP_HIT_THRESHOLD_DEG = 10;

  // Preload immagini
  Object.values(IMG).forEach(src => { const im = new Image(); im.src = src; });

  /* ------------------ DOM ------------------ */
  const enterBtn = document.getElementById("enterBtn");
  const loginBox = document.getElementById("loginBox");
  const okBtn = document.getElementById("okBtn");
  const pwd = document.getElementById("password");
  const err = document.getElementById("errorMsg");

  const app = document.getElementById("app");
  const statusText = document.getElementById("statusText");
  const distanceText = document.getElementById("distanceText");
  const statusImage = document.getElementById("statusImage");
  const toast = document.getElementById("toast");

  const targetDot = document.getElementById("targetDot");

  /* ------------------ State ------------------ */
  let watchId =et lastState = null;
  let insideFuoco = false;

  // Radar / beep
  let dotAngleDeg = null;      // direzione del pallino rispetto al centro (0=su)
  let dotRadiusPx = 0;         // distanza in px (solo per debug/limit)
  let sweepT0 = 0;             // start time of sweep
  let inHitZone = false;       // per suonare una sola volta per passaggio
  let lastBeepAt = 0;          // rate limit beep

  // Audio
  let audioCtx = null;

  /* ------------------ Start flow ------------------ */
  enterBtn.addEventListener("pointerdown", () => {
    enterBtn.style.display = "none";
    loginBox.style.display = "flex";
    pwd.focus();
  }, { passive: true });

  okBtn.addEventListener("click", () => tryLogin());
  pwd.addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });

  function tryLogin(){
    if (pwd.value === "RIELLO") {
      err.style.display = "none";
      startApp(); // user gesture -> sblocca audio + geoloc
    } else {
      err.style.display = "block";
    }
  }

  function startApp(){
    loginBox.style.display = "none";
    document.body.style.background = "#000";
    app.style.display = "flex";

    statusText.textContent = "…";
    distanceText.textContent = "Distanza: …";

    startToastLoop();

    // Sblocca audio in un gesto utente (evita blocchi autoplay) [2](https://developer.mozilla.org/en-US/docs/Web/API/AudioContext/resume)[3](https://developer.mozilla.org/en-US/docs/Web/Media/Guides/Autoplay)
    initAudio();

    // Avvia sweep timer per beep
    sweepT0 = performance.now();
    requestAnimationFrame(sweepLoop);

    if (!navigator.geolocation){
      statusText.textContent = "Geolocalizzazione non supportata";
      return;
    }

    // Tracking live [4](https://carrier-digital.atlassian.net/wiki/spaces/AA/pages/3280699647/AI_PM_0113+Project+Creation+-+Airtable+Dataiku+and+GitHub)
    const options = { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 };
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(onPos, onErr, options);
  }

  /* ------------------ Toast random ogni 15s ------------------ */
  function startToastLoop(){
    setTimeout(showRandomToast, 1200);
    setInterval(showRandomToast, 15000);
  }
  function showRandomToast(){
    const msg = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3500);
  }

  /* ------------------ Audio (beep) ------------------ */
  function initAudio(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      // resume() ritorna una Promise, ma qui basta chiamarlo dentro il gesto utente [2](https://developer.mozilla.org/en-US/docs/Web/API/AudioContext/resume)
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch(_){}
  }

  function beep(){
    if (!audioCtx || audioCtx.state !== "running") return;

    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    // beep “radar”: breve, non fastidioso
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, now);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.10, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.13);
  }

  /* ------------------ Geolocation update ------------------ */
  function onPos(pos){
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    const d = haversineMeters(lat, lon, TARGET_LAT, TARGET_LON);

    const state = classify(d);
    if (state !== lastState) {
      statusImage.classList.add("pop");
      setTimeout(() => statusImage.classList.remove("pop"), 180);

      statusImage.style.opacity = 0;
      setTimeout(() => {
        statusImage.src = IMG[state];
        statusImage.style.opacity = 1;
      }, 120);

      lastState = state;
    }

    statusText.textContent = labelFor(state);
    distanceText.textContent = `Distanza: ${d.toFixed(1)} m`;

    // Radar: target sempre "north-up" (senza bussola)
    updateRadar(lat, lon, d);

    // Vibrazione proporzionale ma limitata [5](https://carrier-digital.atlassian.net/wiki/spaces/AA/pages/3700850727/GitHub+-+Platform+Maintenance+Project+folders+organization+and+the+new+naming+convention)
    handleVibration(d);

    // ingresso zona FUOCO: un colpetto una volta
    const nowInside = d <= T_FUOCO;
    if (nowInside && !insideFuoco) {
      vibrateOnce([90, 60, 90]);
    }
    insideFuoco = nowInside;
  }

  function onErr(){
    statusText.textContent = "Posizione non disponibile";
  }

  function classify(d){
    if (d <= T_FUOCO) return "FUOCO";
    if (d <= T_FUOCHINO) return "FUOCHINO";
    if (d <= T_FREDDO) return "FREDDO";
    return "GHIACCIATO";
  }

  function labelFor(state){
    switch(state){
      case "FUOCO": return "FUOCO 🔥";
      case "FUOCHINO": return "FUOCHINO 🔥";
      case "FREDDO": return "FREDDO 🧊";
      default: return "GHIACCIATO ❄️";
    }
  }

  /* ------------------ Vibrazione (non troppo) ------------------ */
  function handleVibration(d){
    if (typeof navigator.vibrate !== "function") return;

    if (d > 100) return;

    // Interval: 8s (vicino) -> 22s (lontano)
    const interval = clamp(8000 + (d/100)*14000, 8000, 22000);

    // Durata: 160ms (vicino) -> 70ms (lontano)
    const duration = Math.round(clamp(160 - (d/100)*90, 70, 160));

    const now = Date.now();
    if (now - lastVibrateAt >= interval) {
      navigator.vibrate(duration);
      lastVibrateAt = now;
    }
  }

  function vibrateOnce(pattern){
    if (typeof navigator.vibrate !== "function") return;
    navigator.vibrate(pattern);
    lastVibrateAt = Date.now();
  }

  /* ------------------ Radar target positioning ------------------ */
  function updateRadar(userLat, userLon, distMeters){
    const Rpx = 86;
    const maxM = 150;

    const bearingDeg = bearing(userLat, userLon, TARGET_LAT, TARGET_LON); // 0=Nord

    // Dot angle (0=su) per beep sweep
    dotAngleDeg = bearingDeg;

    const r = clamp(distMeters / maxM, 0, 1) * Rpx;
    dotRadiusPx = r;

    const ang = (bearingDeg - 90) * Math.PI / 180;
    const x = r * Math.cos(ang);
    const y = r * Math.sin(ang);

    targetDot.style.transform =
      `translate(calc(-50% + ${x.toFixed(1)}px), calc(-50% + ${y.toFixed(1)}px))`;
  }

  /* ------------------ Sweep detection loop ------------------ */
  function sweepLoop(t){
    // Se non abbiamo ancora posizione del dot, riprova
    if (dotAngleDeg !== null) {
      const elapsed = (t - sweepT0) % SWEEP_PERIOD_MS;
      const sweepRotDeg = (elapsed / SWEEP_PERIOD_MS) * 360;   // rotazione del layer
      const beamDirDeg = (sweepRotDeg + SWEEP_OFFSET_DEG) % 360; // direzione del fascio

      const diff = angDiffDeg(beamDirDeg, dotAngleDeg);

      // Suona quando il fascio "passa sopra" (una volta per passaggio)
      const hit = diff <= SWEEP_HIT_THRESHOLD_DEG && dotRadiusPx > 6; // evita beep se troppo al centro
      const now = performance.now();

      if (hit && !inHitZone) {
        // rate limit: max 1 beep ogni ~900ms anche se jitter
        if (now - lastBeepAt > 900) {
          beep();
          lastBeepAt = now;
        }
        inHitZone = true;
      } else if (!hit) {
        inHitZone = false;
      }
    }

    requestAnimationFrame(sweepLoop);
  }

  function angDiffDeg(a, b){
    let d = Math.abs(a - b) % 360;
    if (d > 180) d = 360 - d;
    return d;
  }

  /* ------------------ Helpers: distance & bearing ------------------ */
  function haversineMeters(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const toRad = (x) => x * Math.PI / 180;

    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);

    const a =
      Math.sin(dLat/2) * Math.sin(dLat/2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon/2) * Math.sin(dLon/2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function bearing(lat1, lon1, lat2, lon2){
    const toRad = (x) => x * Math.PI / 180;
    const toDeg = (x) => x * 180 / Math.PI;

    const φ1 = toRad(lat1), φ2 = toRad(lat2);
    const Δλ = toRad(lon2 - lon1);

    const y = Math.sin(Δλ) * Math.cos(φ2);
    const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
    const θ = Math.atan2(y, x);
    return (toDeg(θ) + 360) % 360;
  }

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
</script>

</body>
</html>
