<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Hunt</title>

  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --accent:#3ad6ff;
      --danger:#ff4b4b;
    }

    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: Arial, sans-serif;
      background:#fff;
      color:#111;
      overflow:hidden;
    }

    /* START SCREEN */
    #enterBtn{
      width:130px;
      height:130px;
      border-radius:50%;
      background:#000;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      font-size:20px;
      font-weight:900;
      letter-spacing:1px;
    }

    /* PASSWORD SCREEN */
    #loginBox{
      display:none;
      flex-direction:column;
      align-items:center;
      gap:10px;
    }

    #password{
      width:min(300px, 82vw);
      padding:12px 14px;
      font-size:16px;
      border-radius:12px;
      border:1px solid #ddd;
      outline:none;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    #okBtn{
      padding:10px 18px;
      border-radius:12px;
      border:none;
      cursor:pointer;
      font-size:16px;
      background:#111;
      color:#fff;
      font-weight:800;
    }

    #errorMsg{
      display:none;
      color:var(--danger);
      font-size:14px;
      font-weight:900;
    }

    /* APP SCREEN */
    #app{
      display:none;
      position:relative;
      width:100%;
      height:100%;
      background:var(--bg);
      color:var(--fg);
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:10px;
      padding:18px 18px 22px;
      box-sizing:border-box;
    }

    /* popup messaggi random */
    #toast{
      position:absolute;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      max-width:min(680px, 92vw);
      padding:10px 14px;
      border-radius:14px;
      background:rgba(255,255,255,0.10);
      border:1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-weight:800;
      text-align:center;
      opacity:0;
      pointer-events:none;
      transition: opacity .35s ease, transform .35s ease;
      z-index:20;
    }

    #toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    #statusImage{
      width:min(320px, 72vw);
      height:auto;
      filter: drop-shadow(0 12px 22px rgba(0,0,0,.6));
      transition: opacity .18s ease, transform .18s ease;
      opacity: 1;
    }

    #statusText{
      font-size:34px;
      font-weight:900;
      letter-spacing:1px;
      text-align:center;
      margin-top:2px;
    }

    #distanceText{
      font-size:16px;
      opacity:.92;
      text-align:center;
      white-space:pre-line;
    }

    /* Radar widget */
    #radarWrap{
      margin-top:10px;
      width:200px;
      height:200px;
      position:relative;
    }

    .radar{
      position:absolute;
      inset:0;
      border-radius:50%;
      overflow:hidden;
      background: radial-gradient(circle, rgba(58,214,255,0.14), #0b1120);
      border:1px solid rgba(255,255,255,0.22);
      box-shadow:0 0 22px rgba(58,214,255,0.25);
    }

    .radar__circle{
      position:absolute;
      inset:14%;
      border-radius:50%;
      border:1px solid rgba(58,214,255,0.35);
    }

    .radar__circle.inner{ 
      inset:30%; 
    }

    .radar__circle.inner2{ 
      inset:46%; 
    }

    .radar__cross{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        linear-gradient(transparent 49.6%, rgba(58,214,255,0.20) 50%, transparent 50.4%),
        linear-gradient(90deg, transparent 49.6%, rgba(58,214,255,0.20) 50%, transparent 50.4%);
      opacity:.75;
      pointer-events:none;
    }

    /* Sweep lento */
    .radar__beam{
      position:absolute;
      inset:-10%;
      background: conic-gradient(from 90deg, rgba(58,214,255,0.30), transparent 60%);
      animation: radarSpin 9.0s linear infinite;
      pointer-events:none;
    }

    @keyframes radarSpin { 
      to { transform: rotate(360deg); } 
    }

    .radar__centerDot{
      position:absolute;
      left:50%; 
      top:50%;
      width:8px; 
      height:8px;
      transform:translate(-50%,-50%);
      background:rgba(58,214,255,0.95);
      border-radius:50%;
      box-shadow:0 0 12px rgba(58,214,255,0.9);
      z-index:6;
    }

    .radar__targetDot{
      position:absolute;
      left:50%; 
      top:50%;
      width:10px; 
      height:10px;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:rgba(255,255,255,0.95);
      box-shadow:0 0 14px rgba(255,255,255,0.65);
      transition: transform .18s ease;
      z-index:5;
    }

    .pop{ 
      transform: scale(1.03); 
    }

    @media (prefers-reduced-motion: reduce){
      .radar__beam{ animation: none; }
      #statusImage{ transition: none; }
      .radar__targetDot{ transition:none; }
      #toast{ transition:none; }
    }
  </style>
</head>

<body>

  <div id="enterBtn">START</div>

  <div id="loginBox">
    <input id="password" type="text" placeholder="Inserisci password" autocomplete="off" />
    <button id="okBtn">OK</button>
    <div id="errorMsg">Password errata</div>
  </div>

  <div id="app">
    <div id="toast"></div>

    <img id="statusImage" src="images/ghiacciato.svg" alt="stato" />
    <div id="statusText">…</div>
    <div id="distanceText">Distanza: …</div>

    <div id="radarWrap" aria-label="Radar">
      <div class="radar">
        <div class="radar__beam"></div>
        <div class="radar__cross"></div>
        <div class="radar__circle"></div>
        <div class="radar__circle inner"></div>
        <div class="radar__circle inner2"></div>
        <div class="radar__centerDot"></div>
        <div id="targetDot" class="radar__targetDot"></div>
      </div>
    </div>
  </div>

<script>
  /* ------------------ Config ------------------ */

  // Target: Chiosco da Friz, Lungolago di Lecco
  const TARGET_LAT = 45.8592048;
  const TARGET_LON = 9.3842831;

  const T_FUOCO = 10;
  const T_FUOCHINO = 25;
  const T_FREDDO = 100;

  const IMG = {
    GHIACCIATO: "images/ghiacciato.svg",
    FREDDO: "images/freddo.svg",
    FUOCHINO: "images/fuochino.svg",
    FUOCO: "images/fuoco.svg"
  };

  const MESSAGES = [
    "pensavi sarebbe stato più semplice, vero?",
    "quanti errori hai fatto nella vita per arrivare a questo punto",
    "ma pensa potevi stare a casa a dormire",
    "questo non c'era nel contratto",
    "maledetti nerd",
    "guarda, c'è un gattino alla tua destra! MIAOOOO",
    "Bip Bip Bip Bip Bip",
    "Citazione di Katy Perry"
  ];

  // Deve combaciare con CSS animation: 9.0s
  const SWEEP_PERIOD_MS = 9000;

  // Con conic-gradient(from 90deg) il fascio base parte verso destra: compenso con +90
  const SWEEP_OFFSET_DEG = 90;

  // Quanto vicino deve essere il fascio al pallino per beepare
  const SWEEP_HIT_THRESHOLD_DEG = 10;

  // Preload immagini
  Object.values(IMG).forEach(src => { 
    const im = new Image(); 
    im.src = src; 
  });

  /* ------------------ DOM ------------------ */

  const enterBtn = document.getElementById("enterBtn");
  const loginBox = document.getElementById("loginBox");
  const okBtn = document.getElementById("okBtn");
  const pwd = document.getElementById("password");
  const err = document.getElementById("errorMsg");

  const app = document.getElementById("app");
  const statusText = document.getElementById("statusText");
  const distanceText = document.getElementById("distanceText");
  const statusImage = document.getElementById("statusImage");
  const toast = document.getElementById("toast");
  const targetDot = document.getElementById("targetDot");

  /* ------------------ State ------------------ */

  let watchId = null;

  // Ultima posizione nota
  let lastUserLat = null;
  let lastUserLon = null;
  let lastDistanceMeters = null;

  // Vibrazione
  let lastVibrateAt = 0;
  let lastState = null;
  let insideFuoco = false;

  // Radar / beep
  let dotAngleDeg = null;           // direzione del target relativa allo schermo: 0=su
  let absoluteBearingDeg = null;    // bearing geografico verso target: 0=Nord
  let dotRadiusPx = 0;
  let sweepT0 = 0;
  let inHitZone = false;
  let lastBeepAt = 0;

  // Bussola telefono
  let compassHeadingDeg = 0;        // 0=Nord, 90=Est, 180=Sud, 270=Ovest
  let compassAvailable = false;
  let compassStarted = false;

  // Audio
  let audioCtx = null;

  /* ------------------ START/LOGIN handlers ------------------ */

  function showLogin(){
    enterBtn.style.display = "none";
    loginBox.style.display = "flex";
    pwd.focus();
  }

  enterBtn.addEventListener("click", showLogin);
  enterBtn.addEventListener("touchstart", (e) => { 
    e.preventDefault(); 
    showLogin(); 
  }, { passive:false });

  okBtn.addEventListener("click", () => tryLogin());
  okBtn.addEventListener("touchstart", (e) => { 
    e.preventDefault(); 
    tryLogin(); 
  }, { passive:false });

  pwd.addEventListener("keydown", (e) => { 
    if (e.key === "Enter") tryLogin(); 
  });

  function tryLogin(){
    if (pwd.value === "4") {
      err.style.display = "none";
      startApp();
    } else {
      err.style.display = "block";
    }
  }

  function startApp(){
    loginBox.style.display = "none";
    document.body.style.background = "#000";
    app.style.display = "flex";

    statusText.textContent = "…";
    distanceText.textContent = "Distanza: …";
    statusImage.src = IMG.GHIACCIATO;

    startToastLoop();

    // Sblocca audio dentro gesto utente
    initAudio();

    // Avvia compass mode
    startCompass();

    // Avvia loop beep sweep
    sweepT0 = performance.now();
    requestAnimationFrame(sweepLoop);

    if (!navigator.geolocation){
      statusText.textContent = "Geolocalizzazione non supportata";
      return;
    }

    const options = { 
      enableHighAccuracy: true, 
      maximumAge: 0, 
      timeout: 10000 
    };

    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
    }

    watchId = navigator.geolocation.watchPosition(onPos, onErr, options);
  }

  /* ------------------ Toast random ogni 15s ------------------ */

  function startToastLoop(){
    setTimeout(showRandomToast, 1200);
    setInterval(showRandomToast, 15000);
  }

  function showRandomToast(){
    const msg = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3500);
  }

  function showCompassToast(msg){
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3000);
  }

  /* ------------------ Audio beep ------------------ */

  function initAudio(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;

      if (!audioCtx) {
        audioCtx = new Ctx();
      }

      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    } catch(_){}
  }

  function beep(){
    if (!audioCtx || audioCtx.state !== "running") return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(880, now);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.10, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.13);
  }

  /* ------------------ Geolocation update ------------------ */

  function onPos(pos){
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const d = haversineMeters(lat, lon, TARGET_LAT, TARGET_LON);

    lastUserLat = lat;
    lastUserLon = lon;
    lastDistanceMeters = d;

    const state = classify(d);

    if (state !== lastState) {
      statusImage.classList.add("pop");
      setTimeout(() => statusImage.classList.remove("pop"), 180);

      statusImage.style.opacity = 0;
      setTimeout(() => {
        statusImage.src = IMG[state];
        statusImage.style.opacity = 1;
      }, 120);

      lastState = state;
    }

    statusText.textContent = labelFor(state);
    distanceText.textContent = `Distanza: ${d.toFixed(1)} m`;

    // Radar in compass mode, con fallback north-up
    updateRadar(lat, lon, d);

    // Vibrazione proporzionale ma limitata
    handleVibration(d);

    // Ingresso zona FUOCO: un colpetto una volta
    const nowInside = d <= T_FUOCO;
    if (nowInside && !insideFuoco) {
      vibrateOnce([90, 60, 90]);
    }
    insideFuoco = nowInside;
  }

  function onErr(error){
    statusText.textContent = "Posizione non disponibile";

    if (error && error.message) {
      distanceText.textContent = error.message;
    }
  }

  function classify(d){
    if (d <= T_FUOCO) return "FUOCO";
    if (d <= T_FUOCHINO) return "FUOCHINO";
    if (d <= T_FREDDO) return "FREDDO";
    return "GHIACCIATO";
  }

  function labelFor(state){
    switch(state){
      case "FUOCO": return "FUOCO 🔥";
      case "FUOCHINO": return "FUOCHINO 🔥";
      case "FREDDO": return "FREDDO 🧊";
      default: return "GHIACCIATO ❄️";
    }
  }

  /* ------------------ Vibrazione ------------------ */

  function handleVibration(d){
    if (typeof navigator.vibrate !== "function") return;
    if (d > 100) return;

    const interval = clamp(8000 + (d / 100) * 14000, 8000, 22000);
    const duration = Math.round(clamp(160 - (d / 100) * 90, 70, 160));

    const now = Date.now();

    if (now - lastVibrateAt >= interval) {
      navigator.vibrate(duration);
      lastVibrateAt = now;
    }
  }

  function vibrateOnce(pattern){
    if (typeof navigator.vibrate !== "function") return;
    navigator.vibrate(pattern);
    lastVibrateAt = Date.now();
  }

  /* ------------------ Radar target positioning ------------------ */

  function updateRadar(userLat, userLon, distMeters){
    const Rpx = 86;

    // Scala radar:
    // entro 300 m il pallino va dal centro al bordo.
    // oltre 300 m rimane sul bordo nella direzione corretta.
    const maxM = 300;

    // Bearing geografico verso target:
    // 0=Nord, 90=Est, 180=Sud, 270=Ovest
    const bearingDeg = bearing(userLat, userLon, TARGET_LAT, TARGET_LON);
    absoluteBearingDeg = bearingDeg;

    // Compass mode:
    // se la bussola è disponibile, il radar diventa relativo alla direzione del telefono.
    // se non è disponibile, resta north-up.
    let relativeDeg = bearingDeg;

    if (compassAvailable) {
      relativeDeg = normalizeDeg(bearingDeg - compassHeadingDeg);
    }

    dotAngleDeg = relativeDeg;

    const r = clamp(distMeters / maxM, 0, 1) * Rpx;
    dotRadiusPx = r;

    // Conversione angolo -> coordinate radar:
    // 0° = alto, 90° = destra, 180° = basso, 270° = sinistra
    const ang = relativeDeg * Math.PI / 180;
    const x = r * Math.sin(ang);
    const y = -r * Math.cos(ang);

    targetDot.style.transform =
      `translate(-50%, -50%) translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
  }

  /* ------------------ Compass mode ------------------ */

  async function startCompass(){
    if (compassStarted) return;
    compassStarted = true;

    try {
      // iPhone/iPad: da iOS 13+ serve permesso esplicito
      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {
        const permission = await DeviceOrientationEvent.requestPermission();

        if (permission !== "granted") {
          compassAvailable = false;
          showCompassToast("Bussola non autorizzata: radar in modalità Nord.");
          return;
        }
      }

      window.addEventListener("deviceorientation", onDeviceOrientation, true);
      window.addEventListener("deviceorientationabsolute", onDeviceOrientation, true);

      showCompassToast("Compass mode attivo.");
    } catch (e) {
      compassAvailable = false;
      showCompassToast("Bussola non disponibile: radar in modalità Nord.");
    }
  }

  function onDeviceOrientation(event){
    let heading = null;

    // iOS Safari:
    // webkitCompassHeading: 0=Nord, 90=Est, 180=Sud, 270=Ovest
    if (typeof event.webkitCompassHeading === "number") {
      heading = event.webkitCompassHeading;
    }

    // Android/Chrome:
    // spesso alpha cresce in senso opposto, quindi si usa 360 - alpha.
    else if (typeof event.alpha === "number") {
      heading = 360 - event.alpha;
    }

    if (heading === null || Number.isNaN(heading)) return;

    compassHeadingDeg = normalizeDeg(heading);
    compassAvailable = true;

    // Se abbiamo già una posizione, aggiorna subito il pallino anche restando fermi.
    if (lastUserLat !== null && lastUserLon !== null && lastDistanceMeters !== null) {
      updateRadar(lastUserLat, lastUserLon, lastDistanceMeters);
    }
  }

  function normalizeDeg(deg){
    return ((deg % 360) + 360) % 360;
  }

  /* ------------------ Sweep detection loop ------------------ */

  function sweepLoop(t){
    if (dotAngleDeg !== null) {
      const elapsed = (t - sweepT0) % SWEEP_PERIOD_MS;
      const sweepRotDeg = (elapsed / SWEEP_PERIOD_MS) * 360;
      const beamDirDeg = (sweepRotDeg + SWEEP_OFFSET_DEG) % 360;

      const diff = angDiffDeg(beamDirDeg, dotAngleDeg);
      const hit = diff <= SWEEP_HIT_THRESHOLD_DEG && dotRadiusPx > 6;

      const now = performance.now();

      if (hit && !inHitZone) {
        if (now - lastBeepAt > 900) {
          beep();
          lastBeepAt = now;
        }
        inHitZone = true;
      } else if (!hit) {
        inHitZone = false;
      }
    }

    requestAnimationFrame(sweepLoop);
  }

  function angDiffDeg(a, b){
    let d = Math.abs(a - b) % 360;
    if (d > 180) d = 360 - d;
    return d;
  }

  /* ------------------ Helpers: distance & bearing ------------------ */

  function haversineMeters(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const toRad = (x) => x * Math.PI / 180;

    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);

    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function bearing(lat1, lon1, lat2, lon2){
    const toRad = (x) => x * Math.PI / 180;
    const toDeg = (x) => x * 180 / Math.PI;

    const phi1 = toRad(lat1);
    const phi2 = toRad(lat2);
    const deltaLambda = toRad(lon2 - lon1);

    const y = Math.sin(deltaLambda) * Math.cos(phi2);
    const x =
      Math.cos(phi1) * Math.sin(phi2) -
      Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);

    const theta = Math.atan2(y, x);
    return normalizeDeg(toDeg(theta));
  }

  function clamp(v, a, b){ 
    return Math.max(a, Math.min(b, v)); 
  }
</script>

</body>
</html>
