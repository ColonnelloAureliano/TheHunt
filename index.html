<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hunt</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: white;
        font-family: Arial;
        transition: 0.3s;
    }

    #button {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: black;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        font-size: 18px;
    }

    #inputBox {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    input {
        padding: 10px;
        font-size: 16px;
        text-align: center;
    }

    button {
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
    }

    #error {
        color: red;
        font-size: 14px;
        display: none;
    }

    #screen {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: white;
        text-align: center;
        white-space: pre-line;
    }

    #status {
        font-size: 32px;
        margin-bottom: 10px;
    }
</style>
</head>

<body>

<div id="button">entra</div>

<div id="inputBox">
    <input type="text" id="password" placeholder="Inserisci password">
    <button onclick="checkPassword()">OK</button>
    <div id="error">Password errata</div>
</div>

<div id="screen">
    <div id="status"></div>
    <div id="distance"></div>
</div>

<script>

const TARGET_LAT = 45.851823282124876;
const TARGET_LON = 9.40799408339509;

let wasInside10 = false;

// click entra
document.getElementById("button").onclick = () => {
    document.getElementById("button").style.display = "none";
    document.getElementById("inputBox").style.display = "flex";
};

// verifica password
function checkPassword() {
    const pwd = document.getElementById("password").value;

    if (pwd === "RIELLO") {
        startApp();
    } else {
        document.getElementById("error").style.display = "block";
    }
}

// AVVIO APP (fix iPhone: chiamata dopo click utente)
function startApp() {
    document.body.style.background = "black";
    document.getElementById("inputBox").style.display = "none";
    document.getElementById("screen").style.display = "flex";

    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(updatePosition, showError, {
            enableHighAccuracy: true,
            maximumAge: 0
        });
    }
}

// update live
function updatePosition(pos) {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    const d = distance(lat, lon, TARGET_LAT, TARGET_LON);

    let text = "";

    if (d <= 10) text = "FUOCO 🔥";
    else if (d <= 25) text = "FUOCHINO 🔥";
    else if (d <= 100) text = "FREDDO 🧊";
    else text = "GHIACCIATO ❄️";

    document.getElementById("status").innerText = text;
    document.getElementById("distance").innerText = "Distanza: " + d.toFixed(1) + " m";

    // vibrazione solo quando entra nei 10m
    if (d <= 10 && !wasInside10) {
        if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200]);
        }
    }

    wasInside10 = d <= 10;
}

// errore GPS
function showError() {
    document.getElementById("status").innerText = "Posizione non disponibile";
}

// distanza (Haversine)
function distance(lat1, lon1, lat2, lon2) {
    const R = 6371000;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat/2)*Math.sin(dLat/2) +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)*Math.sin(dLon/2);

    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

</script>

</body>
</html>
